<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=>, initial-scale=1.0">
    <title>Document</title>

    <style>
        div {
            height: 200px;
            background-color: blue;
            color: white;
        }
        body {
            display: grid;
            grid-template-columns: 1fr 200px 1fr;
            gap: 20px;
        }
        #firstDiv {
            background-color: red;
            height: 100px;
            grid-column: 1 / 4;
        }
        div:nth-child(2) {
            background-color: green;
            grid-row: 2 / 4;
            height: 100%;
        }


    </style>
</head>
<body>
    <div id="firstDiv">1</div>
    <div>2</div>
    <div>3</div>
    <div>4</div>
    <div>5</div>
    <div>6</div>
</body>
</html>
