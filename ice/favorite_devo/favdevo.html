<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Favorite Devotionals</title>
  <link rel="stylesheet" href="styles/styles.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-image">
        <h1>My Favorite<br>Devotionals</h1>
      </div>
    </header>
    <main>
      <div class="content-box">
        <!-- Add your devotional content here -->
        <table>
          <!-- tr is table row -->
          <tr  id="header">
            <th>Speaker</th>
            <th>Title</th>
            <th>Location</th>
            <th>Year</th>
          </tr>
          <tr>
            <td>Dan Barnes</td>
            <td>Your Identity and Worth</td>
            <td>BYU-Idaho</td>
            <td>2026</td>
          </tr>
          <tr>
            <td>J.B. Haws</td>
            <td>Wrestling With Comparison</td>
            <td>BYU Provo</td>
            <td>2019</td>
          </tr>
          <tr>
            <td>Elder David A. Bednar and <br> Susan K. Bednar</td>
            <td>BYU-Idaho 25th Anniversary Devotional</td>
            <td>BYU-Idaho</td>
            <td>2026</td>
          </tr>
        </table>
        <form>
          <label for="speaker">Speaker: </label>
          <input type="text" id="speaker" required placeholder="President Oaks">

          <label for="title">Title: </label>
          <input type="text" id="title" required placeholder="The Gospel of Jesus Christ...">

          <label for="location">Location: </label>
          <input type="text" id="location" required placeholder="General Conference">

          <label for="year">Year: </label>
          <input type="text" id="year" required placeholder="2026">

          <input type="submit" value="Submit">
        </form>
      </div>
    </main>
  </div>
</body>
</html>
